name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos_dev_pw
          POSTGRES_DB: pos
        ports:
          - 15450:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        env:
          DATABASE_URL: postgres://pos:pos_dev_pw@localhost:15450/pos
          DATABASE_TEST_URL: postgres://pos:pos_dev_pw@localhost:15450/pos
          JWT_SECRET: ci_test_jwt_secret_min_32_chars_long_key_12345
          COOKIE_SECURE: false
          TRUST_PROXY: false
        run: npm run test
