openapi: "3.0.3"
info:
  title: "POS Bán Hàng F&B (Quán Ăn, Cafe) · API"
  version: "0.1.0"
  description: "Sinh từ 09-api.md bởi ba-kit (ba_openapi.py). Sửa tài liệu rồi sinh lại; mô tả phản hồi và URL máy chủ điền trong công cụ, không ghi khóa vào file."
paths:
  "/api/v1/shifts/open":
    post:
      operationId: "api01"
      summary: "API-01 Mở ca làm việc mới và ghi nhận tiền lẻ đầu ca trong két"
      x-ba-requirements:
        - "FR-06"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                tienDauCa:
                  type: "number"
                  description: "Lớn hơn hoặc bằng 0 · Chuyển đổi: Số nguyên VND"
                  example: "1000000"
              required:
                - "tienDauCa"
      responses:
        "201":
          description: "Thành công"
      security:
        - bearerAuth: []
  "/api/v1/orders/kitchen-print":
    post:
      operationId: "api02"
      summary: "API-02 Gửi danh sách món và phát lệnh in phiếu chế biến KOT xuống Bếp/Bar"
      x-ba-requirements:
        - "FR-03"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                items:
                  type: "object"
                  properties:
                    soLuong:
                      type: "integer"
                      description: "Lớn hơn 0 · Chuyển đổi: Số nguyên"
                      example: "2"
                    ghiChu:
                      type: "string"
                      maxLength: 100
                      description: "Ghi chú khẩu vị khách · Chuyển đổi: Chuỗi"
                      example: "\"Ít ngọt, nhiều đá\""
                  required:
                    - "soLuong"
      responses:
        "200":
          description: "Thành công"
        "503":
          description: "Máy in Bếp/Bar LAN mất kết nối hoặc kẹt giấy · Ghi log hệ thống, giữ nguyên đơn hàng và cho phép thử in lại · ERR-06 · API-02"
      security:
        - bearerAuth: []
  "/api/v1/tables/transfer":
    post:
      operationId: "api03"
      summary: "API-03 Điều chuyển toàn bộ món từ bàn này sang bàn khác hoặc gộp bàn"
      x-ba-requirements:
        - "FR-04"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                banNguonId:
                  type: "string"
                  description: "Chuyển đổi: Chuỗi mã bàn"
                banDichId:
                  type: "string"
                  description: "Chuyển đổi: Chuỗi mã bàn"
              required:
                - "banNguonId"
                - "banDichId"
      responses:
        "200":
          description: "Thành công"
      security:
        - bearerAuth: []
  "/api/v1/auth/verify-pin":
    post:
      operationId: "api04"
      summary: "API-04 Xác thực mã PIN Quản lý cho các thao tác nhạy cảm (hủy món, giảm giá)"
      x-ba-requirements:
        - "FR-10"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                pinCode:
                  type: "string"
                  maxLength: 20
                  description: "Định dạng CA-YYYYMMDD-nn · Chuyển đổi: Chuỗi số 4-6 ký tự"
                  example: "CA-20261020-01"
                lyDo:
                  type: "string"
                  maxLength: 255
                  description: "Tối thiểu 5 ký tự nếu hủy món · Chuyển đổi: Chuỗi tối thiểu 5 ký tự"
                  example: "\"Khách đổi ý sang trà đào\""
              required:
                - "pinCode"
                - "lyDo"
      responses:
        "200":
          description: "Thành công"
        "403":
          description: "Mã PIN Quản lý không chính xác · Tăng bộ đếm số lần sai liên tiếp của tài khoản · ERR-02 · API-04"
        "429":
          description: "Mã PIN bị khóa tạm thời do sai 5 lần · Chặn toàn bộ thao tác xác thực PIN trong vòng 5 phút · ERR-03 · API-04"
      security:
        - bearerAuth: []
  "/api/v1/payments/vietqr":
    post:
      operationId: "api05"
      summary: "API-05 Tạo mã VietQR động chứa số tiền thanh toán và mã hóa đơn"
      x-ba-requirements:
        - "FR-12"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                soTien:
                  type: "number"
                  description: "TổngTiền - GiảmGiá · Chuyển đổi: Số nguyên VND"
                  example: "225000"
                maHoaDon:
                  type: "string"
                  maxLength: 20
                  description: "Định dạng HD-YYYYMMDD-nnnn · Chuyển đổi: Chuỗi mã hóa đơn"
                  example: "HD-20261020-0042"
              required:
                - "soTien"
                - "maHoaDon"
      responses:
        "200":
          description: "Thành công"
        "504":
          description: "Cổng VietQR quá hạn thời gian chờ · Hủy mã QR cũ và cho phép tạo mã mới hoặc đổi sang tiền mặt · ERR-09 · API-05"
      security:
        - bearerAuth: []
  "/api/v1/payments/cash":
    post:
      operationId: "api06"
      summary: "API-06 Xác nhận thanh toán tiền mặt và phát lệnh in hóa đơn hoàn tất"
      x-ba-requirements:
        - "FR-11"
        - "FR-13"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                tienKhachDua:
                  type: "number"
                  description: "TổngTiền - GiảmGiá · Chuyển đổi: Số nguyên VND"
                  example: "225000"
              required:
                - "tienKhachDua"
      responses:
        "200":
          description: "Thành công"
        "500":
          description: "Máy in hóa đơn bị kẹt giấy hoặc hết giấy · Đánh dấu đơn đã thanh toán thành công và kích hoạt nút In lại · ERR-10 · API-06"
      security:
        - bearerAuth: []
  "/api/v1/shifts/cash-transaction":
    post:
      operationId: "api07"
      summary: "API-07 Ghi nhận khoản nạp thêm hoặc chi trả tiền mặt khẩn cấp trong ca (Cash In/Out)"
      x-ba-requirements:
        - "FR-07"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                soTien:
                  type: "string"
                  description: "Chuyển đổi: Số nguyên VND"
                lyDo:
                  type: "string"
                  description: "Chuyển đổi: Chuỗi mô tả lý do"
              required:
                - "soTien"
                - "lyDo"
      responses:
        "201":
          description: "Thành công"
      security:
        - bearerAuth: []
  "/api/v1/shifts/close":
    post:
      operationId: "api08"
      summary: "API-08 Kết ca làm việc, kiểm kê tiền thực đếm và Quản lý ký duyệt Z-Report"
      x-ba-requirements:
        - "FR-08"
        - "FR-09"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                tienThucDem:
                  type: "number"
                  description: "Lớn hơn hoặc bằng 0 · Chuyển đổi: Số nguyên VND"
                  example: "5450000"
                giaiTrinh:
                  type: "string"
                  maxLength: 255
                  description: "Bắt buộc nếu ĐộLệch khác 0 · Chuyển đổi: Bắt buộc nếu có chênh lệch"
                  example: "\"Thối nhầm tiền cho bàn 3\""
              required:
                - "tienThucDem"
      responses:
        "200":
          description: "Thành công"
        "409":
          description: "Còn bàn ăn chưa thanh toán khi đóng ca · Chặn đóng ca và yêu cầu thanh toán hết các bàn · ERR-04 · API-08"
        "422":
          description: "Tiền mặt kết ca bị lệch mà thiếu giải trình · Chặn đóng ca và yêu cầu nhập lý do giải trình · ERR-05 · API-08"
      security:
        - bearerAuth: []
  "/api/v1/reports/revenue":
    get:
      operationId: "api09"
      summary: "API-09 Tra cứu báo cáo doanh thu theo ca, theo phương thức thanh toán và top món"
      x-ba-requirements:
        - "FR-14"
      parameters:
        - name: "fromDate"
          in: "query"
          required: true
          schema:
            type: "string"
            description: "Chuyển đổi: Định dạng YYYY-MM-DD"
        - name: "toDate"
          in: "query"
          required: true
          schema:
            type: "string"
            description: "Chuyển đổi: Định dạng YYYY-MM-DD"
      responses:
        "200":
          description: "Thành công"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
